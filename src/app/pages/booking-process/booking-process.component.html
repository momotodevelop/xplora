@if(confirmationLoader){
    <app-booking-creation-loader
        [bookingId]="bookingID!"
        (completed)="completeLoader()"
        [cashPaymentTime]="43200"
        [speiPaymentTime]="speiPaymentTimeSeconds"
        [steps]="confirmationLoaderSteps"
        [paymentMethod]="paymentMethod"
        [paymentType]="paymentMethod === 'DEFERRED' ? 'DELAYED' : 'NOW'">
    </app-booking-creation-loader>
}@else if(booking){
    <main class="container booking-layout" #stepperContainer>
        <div class="row y-gap-24">
            <div class="col-lg-8">
                <mat-vertical-stepper
                    class="booking-stepper"
                    [class.booking-stepper--payment]="activeStep === 4"
                    [linear]="true"
                    [selectedIndex]="activeStep"
                    (selectionChange)="onStepSelectionChange($event.selectedIndex)">

                    <mat-step [completed]="contactStepComplete" [editable]="true">
                        <ng-template matStepLabel>Titular de la reservación</ng-template>
                        <ng-template matStepContent>
                            <div class="step-content">
                                <app-contact-info (valid)="onContactValidity($event)"></app-contact-info>
                                <div class="step-actions step-actions--end">
                                    <button
                                        type="button"
                                        mat-flat-button
                                        color="primary"
                                        [disabled]="!contactInfo || loadingProcess"
                                        (click)="processContact()">
                                        Continuar
                                        <mat-icon>arrow_forward</mat-icon>
                                    </button>
                                </div>
                            </div>
                        </ng-template>
                    </mat-step>

                    <mat-step [completed]="passengersStepComplete" [editable]="true">
                        <ng-template matStepLabel>Pasajeros</ng-template>
                        <ng-template matStepContent>
                            <div class="step-content">
                                <app-passengers
                                    [adults]="booking.flightDetails.passengers.counts.adults"
                                    [childrens]="booking.flightDetails.passengers.counts.childrens"
                                    [infants]="booking.flightDetails.passengers.counts.infants"
                                    [passengersData]="booking.flightDetails.passengers.details ?? []"
                                    (valid)="onPassengersValidity($event)">
                                </app-passengers>
                                <div class="step-actions">
                                    <button type="button" mat-button (click)="prev()">
                                        <mat-icon>arrow_back</mat-icon>
                                        Anterior
                                    </button>
                                    <button
                                        type="button"
                                        mat-flat-button
                                        color="primary"
                                        [disabled]="!passengers || passengersForm?.savingRequestedPassengers"
                                        (click)="processPassengers()">
                                        Continuar
                                        <mat-icon>arrow_forward</mat-icon>
                                    </button>
                                </div>
                            </div>
                        </ng-template>
                    </mat-step>

                    <mat-step [completed]="seatsStepComplete" [editable]="true">
                        <ng-template matStepLabel>Asientos</ng-template>
                        <ng-template matStepContent>
                            <div class="step-content">
                                <app-seats
                                    (completed)="seatSelection = $event"
                                    (loading)="loadingSeats = $event"
                                    (pendingSeats)="pendingSelectionSeats = $event"
                                    (skip)="skipStep('SEATS')"
                                    (goToPassengers)="goToPassengers()">
                                </app-seats>
                                <div class="step-actions">
                                    <button type="button" mat-button (click)="prev()">
                                        <mat-icon>arrow_back</mat-icon>
                                        Anterior
                                    </button>
                                    <button
                                        type="button"
                                        mat-flat-button
                                        color="primary"
                                        [disabled]="loadingSeats"
                                        (click)="processSeats()">
                                        Continuar
                                        <mat-icon>arrow_forward</mat-icon>
                                    </button>
                                </div>
                            </div>
                        </ng-template>
                    </mat-step>

                    <mat-step [completed]="extrasStepComplete" [editable]="true">
                        <ng-template matStepLabel>Adicionales</ng-template>
                        <ng-template matStepContent>
                            <div class="step-content">
                                <app-extras (next)="completeExtrasStep()" (skip)="skipStep('EXTRAS')" #extras></app-extras>
                                <div class="step-actions">
                                    <button type="button" mat-button (click)="prev()">
                                        <mat-icon>arrow_back</mat-icon>
                                        Anterior
                                    </button>
                                    <button type="button" mat-flat-button color="primary" (click)="completeExtrasStep()">
                                        Continuar
                                        <mat-icon>arrow_forward</mat-icon>
                                    </button>
                                </div>
                            </div>
                        </ng-template>
                    </mat-step>

                    <mat-step [completed]="false" [editable]="true">
                        <ng-template matStepLabel>Pago</ng-template>
                        <ng-template matStepContent>
                            <section class="payment-step">
                                <div class="payment-step__heading">
                                    <button type="button" mat-icon-button aria-label="Volver a adicionales" (click)="prev()">
                                        <mat-icon>arrow_back</mat-icon>
                                    </button>
                                    <div>
                                        <span>Paso final</span>
                                        <h2>Elige cómo pagar</h2>
                                    </div>
                                </div>
                                <app-payment
                                    [speiPaymentTimeMinutes]="speiPaymentTimeMinutes"
                                    (selectedPaymentMethod)="changePaymentMethod($event)"
                                    (paymentProcessStart)="startPayment($event)">
                                </app-payment>
                            </section>
                        </ng-template>
                    </mat-step>
                </mat-vertical-stepper>
            </div>

            <aside class="col-lg-4 booking-summary">
                <app-booking-sidebar (openInsuranceExtra)="openInsuranceFromSidebar()"></app-booking-sidebar>
            </aside>
        </div>
    </main>
}
