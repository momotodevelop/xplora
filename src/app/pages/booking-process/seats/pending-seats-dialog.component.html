<h1 mat-dialog-title>Asientos Pendientes</h1>
<mat-dialog-content>
    @if(data===1){
        <p>Aún hay un <b>asiento pendiente</b> por asignar.</p>
        <p>¿Desea continuar <b>sin asignarlo</b>?</p>
    }@else{
        <p>Aún hay <b>{{data}} asientos pendientes</b> por asignar.</p>
        <p>¿Desea continuar <b>sin asignarlos</b>?</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button [mat-dialog-close]="false" cdkFocusInitial>Cancelar</button>
    <button mat-flat-button [mat-dialog-close]="true" color="primary">Continuar</button>
</mat-dialog-actions>
