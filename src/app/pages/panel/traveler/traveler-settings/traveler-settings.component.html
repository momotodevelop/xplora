<div class="dashboard__main">
    <div class="dashboard__content bg-light-2" [ngStyle]="{'min-height': 'calc(100vh - ' + headerHeight + 'px)'}">
        <div class="row y-gap-20 justify-between items-end pb-60 lg:pb-40 md:pb-32">
            <div class="col-auto">
            <h1 class="text-30 lh-14 fw-600">Configuración</h1>
            <div class="text-15 text-light-1">Ajusta las preferencias de tu cuenta y perfil.</div>
            </div>
            <div class="col-auto">
            </div>
        </div>
        <div class="py-30 px-30 rounded-4 bg-white shadow-3"  style="flex: 1;">
            <div class="tabs -underline-2 js-tabs">
                <div class="tabs__controls row x-gap-40 y-gap-10 lg:x-gap-20">
                    <div class="col-auto">
                        <a routerLink="perfil" routerLinkActive="is-tab-el-active" class="tabs__button text-18 lg:text-16 text-light-1 fw-500 pb-5 lg:pb-0">Perfil</a>
                    </div>
                    <div class="col-auto">
                        <a routerLink="pasajeros" routerLinkActive="is-tab-el-active" class="tabs__button text-18 lg:text-16 text-light-1 fw-500 pb-5 lg:pb-0">Pasajeros guardados</a>
                    </div>
                    <!--
                    <div class="col-auto">
                        <a routerLink="contacto" routerLinkActive="is-tab-el-active" class="tabs__button text-18 lg:text-16 text-light-1 fw-500 pb-5 lg:pb-0">Contacto</a>
                    </div> -->
                </div>
                <div class="tabs__content pt-30">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
        <app-traveler-footer></app-traveler-footer>
    </div>
</div>
