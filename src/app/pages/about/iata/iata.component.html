<ng-template #zoomFooter>
    <mat-slider class="w-100 m-0" min="20" max="40" step="1">
        <input class="p-0" (valueChange)="setZoom($event)" [value]="zoom" matSliderThumb>
    </mat-slider>
</ng-template>
<app-xplora-bottom-sheet title="Certificado IATA" subtitle="Acreditaciones Xplora Travel" [footerTemplate]="zoomFooter">
<div style="height: 55vh;">
    <ngx-extended-pdf-viewer 
        [showToolbar]="false"
        [src]="src"
        [zoom]="zoom">
    </ngx-extended-pdf-viewer>
</div>
</app-xplora-bottom-sheet>
